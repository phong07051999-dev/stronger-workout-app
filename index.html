<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c111b">
  <meta name="description" content="Offline strength and tendon workout journal. Track every set, review your progress, export your data.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stronger Log">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Stronger — Offline Workout Log</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="brandmark" aria-hidden="true"><svg viewBox="0 0 48 48" width="30" height="30" fill="none"><path d="M8 29h7l5-11 6 18 5-11h9" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><span class="brandtitle">STRONGER</span><span class="brandsub">YOUR TRAINING JOURNAL</span></div></div>
      <span id="connection" class="connection"><span class="statusdot"></span> Local saving</span>
    </header>
    <main id="main" class="main"><div class="boot">Loading your workout journal…</div></main>
    <nav class="bottomnav" aria-label="Main navigation">
      <button class="navbtn active" data-tab="workout" aria-label="Workout"><svg viewBox="0 0 24 24"><path d="M3 9v6m3-9v12m12-12v12m3-9v6M6 12h12"/></svg><span>Workout</span></button>
      <button class="navbtn" data-tab="history" aria-label="History"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h4m-4 4h8"/></svg><span>History</span></button>
      <button class="navbtn" data-tab="insights" aria-label="Insights"><svg viewBox="0 0 24 24"><path d="M4 20V5m0 15h17M7 16l5-5 4 3 5-8"/></svg><span>Progress</span></button>
      <button class="navbtn" data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.8-1l-.4-2.5h-4l-.4 2.5a7 7 0 0 0-1.8 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.8 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.8-1l2.4 1 2-3.5-2-1.5A7 7 0 0 0 19 12Z"/></svg><span>Settings</span></button>
    </nav>
    <div id="resttimer" class="resttimer" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modalroot"></div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
